name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Restore backend with lock files
        run: dotnet restore Jarvis.sln --locked-mode

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Verify EF migration model has no drift
        run: dotnet ef migrations has-pending-model-changes --project src/backend/Jarvis.Infrastructure/Jarvis.Infrastructure.csproj --startup-project src/backend/Jarvis.Api/Jarvis.Api.csproj --context Jarvis.Infrastructure.Data.JarvisDbContext

      - name: Build backend
        run: dotnet build Jarvis.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test Jarvis.sln --configuration Release --no-build --no-restore

      - name: Verify .NET formatting
        run: dotnet format Jarvis.sln --no-restore --verify-no-changes

      - name: Audit NuGet packages
        run: dotnet list Jarvis.sln package --vulnerable --include-transitive

  workspace-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Lint workspace
        run: pnpm lint

      - name: Run headless workspace tests
        run: pnpm test:headless

      - name: Build workspace
        run: pnpm build

      - name: Audit npm packages
        run: pnpm check:package-audit

  contracts-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Restore backend for OpenAPI generation
        run: dotnet restore Jarvis.sln --locked-mode

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI generated contract
        run: pnpm check:openapi

      - name: Reject OpenAPI generated drift
        run: git diff --exit-code -- artifacts/openapi/openapi.json packages/contracts-ts/src/generated/openapi.ts

      - name: Verify Codex 0.146.0 schema contract
        run: pnpm check:codex-schema

      - name: Verify Codex schema canonical JSON
        run: pnpm check:codex-schema-canonical

      - name: Test Codex schema canonicalizer
        run: pnpm test:codex-schema-canonical

      - name: Run source secret scan
        run: pnpm check:secrets

      - name: Test secret scan fixtures
        run: pnpm test:secret-scan

      - name: Test service manifests and launchd safety seams
        run: pnpm test:service-manifest

      - name: Test CI and sandbox contracts
        run: pnpm test:ci-contract

  desktop-renderer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize renderer scenario evidence
        if: always()
        run: |
          set -euo pipefail
          evidence_directory="$RUNNER_TEMP/jarvis-phase9a-renderer"
          evidence_file="$evidence_directory/scenario.json"
          mkdir -p "$evidence_directory"
          umask 077
          printf '%s\n' '{"status":"not-run","observationAvailable":false,"failureReason":"renderer-scenario-not-started"}' > "$evidence_file"

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Electron runtime
        run: pnpm --filter @jarvis/desktop exec install-electron

      - name: Build Desktop renderer scenario input
        run: pnpm --filter @jarvis/desktop build

      - name: Prepare Electron Chromium sandbox
        run: eng/scripts/prepare-electron-linux-sandbox.sh

      - name: Prepare D-Bus for Electron renderer
        run: |
          set -euo pipefail
          system_bus_socket="/run/dbus/system_bus_socket"
          if [[ ! -S "$system_bus_socket" ]]; then
            command -v dbus-daemon >/dev/null
            sudo -n install -d -m 0755 /run/dbus
            sudo -n dbus-daemon --system --fork
          fi
          for attempt in 1 2 3 4 5; do
            [[ -S "$system_bus_socket" ]] && break
            sleep 1
          done
          test -S "$system_bus_socket"
          command -v dbus-run-session >/dev/null
          dbus-run-session -- true

      - name: Run built renderer scenario in Xvfb
        run: |
          mkdir -p "$RUNNER_TEMP/jarvis-phase9a-renderer"
          dbus-run-session -- xvfb-run -a \
            --server-args="-screen 0 1280x1024x24" \
            env JARVIS_DESKTOP_SCENARIO_OUTPUT="$RUNNER_TEMP/jarvis-phase9a-renderer/scenario.json" \
            pnpm --filter @jarvis/desktop test:renderer-scenario:built

      - name: Upload bounded renderer scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-desktop-renderer-evidence
          path: ${{ runner.temp }}/jarvis-phase9a-renderer/scenario.json
          if-no-files-found: error
          retention-days: 14

  mobile-static:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts package
        run: pnpm --filter @jarvis/contracts-ts build

      - name: Build shared realtime agent package
        run: pnpm --filter @jarvis/realtime-agent build

      - name: Build shared API client package
        run: pnpm --filter @jarvis/api-client-ts build

      - name: Typecheck React Native mobile client
        run: pnpm --filter @jarvis/mobile typecheck

      - name: Test React Native mobile client
        run: pnpm --filter @jarvis/mobile test

      - name: Build Android release Metro bundle
        run: pnpm --filter @jarvis/mobile bundle:android

      - name: Build iOS release Metro bundle
        run: pnpm --filter @jarvis/mobile bundle:ios

      - name: Verify mobile native configuration and bundle safety
        run: pnpm check:mobile-native-config -- --require-bundles

      - name: Upload mobile static bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-mobile-static
          path: |
            src/clients/mobile/android/app/src/main/assets/index.android.bundle
            src/clients/mobile/ios/main.jsbundle
          if-no-files-found: error
          retention-days: 14

  e2e:
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-matrix'))) }}
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Restore backend with lock files
        run: dotnet restore Jarvis.sln --locked-mode

      - name: Build backend and E2E project
        run: dotnet build Jarvis.sln --configuration Release --no-restore

      - name: Run E2E and performance smoke
        run: tests/e2e/run-e2e.sh

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-e2e-reports
          path: artifacts/test-reports/phase6-e2e
          if-no-files-found: error
          retention-days: 14

  android-native:
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-matrix'))) }}
    needs: mobile-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/clients/mobile/android/**/*.gradle*
            src/clients/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Android SDK and install the pinned NDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ] \
            && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            echo "::error::Android SDK platform 37 is not installed."
            find "$ANDROID_SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d -print
            exit 1
          fi
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/27.1.12297006" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;27.1.12297006"
          fi
          test -d "$ANDROID_SDK_ROOT/ndk/27.1.12297006"

      - name: Build Android debug application
        working-directory: src/clients/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-android-debug
          path: src/clients/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-native:
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-matrix'))) }}
    needs: mobile-static
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install iOS native dependencies
        working-directory: src/clients/mobile/ios
        run: pod install

      - name: Build iOS Simulator application
        working-directory: src/clients/mobile/ios
        run: |
          xcodebuild \
            -workspace JarvisMobile.xcworkspace \
            -scheme JarvisMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/JarvisMobileDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-ios-simulator-debug
          path: ${{ runner.temp }}/JarvisMobileDerivedData/Build/Products/Debug-iphonesimulator/JarvisMobile.app
          if-no-files-found: error
          retention-days: 14

  macos-release-smoke:
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-matrix'))) }}
    needs: [backend-quality, workspace-quality, contracts-security, desktop-renderer-linux, mobile-static, e2e]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Setup pnpm 10.24.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Restore backend with lock files
        run: dotnet restore Jarvis.sln --locked-mode

      - name: Install TypeScript workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Electron runtime
        run: pnpm --filter @jarvis/desktop exec install-electron

      - name: Build and package unsigned arm64 Desktop artifact
        run: eng/scripts/package-desktop-macos.sh

      - name: Publish Backend and Device Node arm64 artifacts
        run: eng/scripts/publish-macos-arm64.sh

      - name: Run isolated launchd API and Device Node smoke
        run: eng/scripts/launchd-smoke-macos.sh

      - name: Upload macOS release-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-macos-arm64-release-test
          path: |
            src/clients/desktop/out/make
            artifacts/services
            artifacts/releases
          if-no-files-found: error
          retention-days: 14

  phase9a-verification-summary:
    if: ${{ always() }}
    needs: [backend-quality, workspace-quality, contracts-security, desktop-renderer-linux, mobile-static, e2e, android-native, ios-native, macos-release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FULL_MATRIX_REQUESTED: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-matrix'))) }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BACKEND_RESULT: ${{ needs['backend-quality'].result }}
      WORKSPACE_RESULT: ${{ needs['workspace-quality'].result }}
      CONTRACTS_RESULT: ${{ needs['contracts-security'].result }}
      DESKTOP_RENDERER_RESULT: ${{ needs['desktop-renderer-linux'].result }}
      MOBILE_STATIC_RESULT: ${{ needs['mobile-static'].result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      ANDROID_RESULT: ${{ needs['android-native'].result }}
      IOS_RESULT: ${{ needs['ios-native'].result }}
      MACOS_RESULT: ${{ needs['macos-release-smoke'].result }}
    steps:
      - name: Generate bounded remote verification evidence
        run: |
          set -euo pipefail
          evidence_path="artifacts/test-reports/phase9a/remote-verification.json"
          status_path="$RUNNER_TEMP/phase9a-summary-status"
          mkdir -p "$(dirname "$evidence_path")"

          full_matrix_status="not-requested"
          full_matrix_requested_json=false
          if [[ "$FULL_MATRIX_REQUESTED" == "true" ]]; then
            full_matrix_status="requested"
            full_matrix_requested_json=true
          fi

          e2e_result="$E2E_RESULT"
          android_result="$ANDROID_RESULT"
          ios_result="$IOS_RESULT"
          macos_result="$MACOS_RESULT"
          if [[ "$FULL_MATRIX_REQUESTED" != "true" ]]; then
            e2e_result="not-requested"
            android_result="not-requested"
            ios_result="not-requested"
            macos_result="not-requested"
          fi

          overall_status="success"
          for result in \
            "$BACKEND_RESULT" \
            "$WORKSPACE_RESULT" \
            "$CONTRACTS_RESULT" \
            "$DESKTOP_RENDERER_RESULT" \
            "$MOBILE_STATIC_RESULT"; do
            if [[ "$result" != success ]]; then
              overall_status="failure"
            fi
          done

          if [[ "$FULL_MATRIX_REQUESTED" == "true" ]]; then
            for result in \
              "$E2E_RESULT" \
              "$ANDROID_RESULT" \
              "$IOS_RESULT" \
              "$MACOS_RESULT"; do
              if [[ "$result" != success ]]; then
                overall_status="failure"
              fi
            done
          fi

          generated_at_utc="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          jq -n \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg head_sha "$HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg full_matrix_status "$full_matrix_status" \
            --argjson full_matrix_requested "$full_matrix_requested_json" \
            --arg backend_result "$BACKEND_RESULT" \
            --arg workspace_result "$WORKSPACE_RESULT" \
            --arg contracts_result "$CONTRACTS_RESULT" \
            --arg desktop_renderer_result "$DESKTOP_RENDERER_RESULT" \
            --arg mobile_static_result "$MOBILE_STATIC_RESULT" \
            --arg e2e_result "$e2e_result" \
            --arg android_result "$android_result" \
            --arg ios_result "$ios_result" \
            --arg macos_result "$macos_result" \
            --arg overall_status "$overall_status" \
            --arg generated_at_utc "$generated_at_utc" \
            '{
              workflowName: $workflow_name,
              runId: $run_id,
              runAttempt: $run_attempt,
              eventName: $event_name,
              ref: $ref,
              headSha: $head_sha,
              repository: $repository,
              fullMatrixRequested: $full_matrix_requested,
              fullMatrix: {
                requested: $full_matrix_requested,
                status: $full_matrix_status
              },
              jobResults: {
                "backend-quality": $backend_result,
                "workspace-quality": $workspace_result,
                "contracts-security": $contracts_result,
                "desktop-renderer-linux": $desktop_renderer_result,
                "mobile-static": $mobile_static_result,
                "e2e": $e2e_result,
                "android-native": $android_result,
                "ios-native": $ios_result,
                "macos-release-smoke": $macos_result
              },
              overallStatus: $overall_status,
              generatedAtUtc: $generated_at_utc
            }' > "$evidence_path"
          printf '%s\n' "$overall_status" > "$status_path"

      - name: Upload remote verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phase9a-remote-verification
          path: artifacts/test-reports/phase9a/remote-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce verification summary status
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/phase9a-summary-status"
          test "$(cat "$RUNNER_TEMP/phase9a-summary-status")" = success
